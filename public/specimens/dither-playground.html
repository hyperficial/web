<!doctype html>
<html lang="en">
<head>
	<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dither playground</title>
<style>
	:root { --bg: #f4f2ee; --ink: #1b1a18; --muted: #6b6760; --lo: #2f4fd6; --hi: #172a9e; color-scheme: light dark; }
	@media (prefers-color-scheme: dark) { :root { --bg: #121110; --ink: #f1efea; --muted: #a09b92; --lo: #c9432e; --hi: #962f21; } }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body { background: var(--bg); color: var(--ink); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; display: grid; grid-template-rows: 1fr auto; }
	canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; }
	form { display: flex; flex-wrap: wrap; gap: 8px 20px; padding: 10px 14px; border-top: 1px solid color-mix(in oklab, var(--ink) 18%, transparent); }
	label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
	input[type=range] { accent-color: var(--lo); width: 110px; }
	output { color: var(--ink); min-width: 2ch; }
</style>
</head>
<body>
<canvas id="c" aria-label="Dither pattern that follows the pointer"></canvas>
<form>
	<label>cell <input id="px" type="range" min="2" max="16" value="6" /><output id="pxo">6</output></label>
	<label>matrix <input id="lv" type="range" min="1" max="3" value="3" /><output id="lvo">8×8</output></label>
	<label>radius <input id="rd" type="range" min="10" max="90" value="45" /><output id="rdo">45</output></label>
</form>
<script>
	const c = document.getElementById('c'), x = c.getContext('2d')
	const $ = (id) => document.getElementById(id)
	let px = 6, lv = 3, rd = 45, mx = 0.5, my = 0.5, t = 0
	const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim()
	function bayer(i, j, n) { let r = 0; for (let k = 0; k < n; k++) { const a = (i >> k) & 1, b = (j >> k) & 1; r = r * 4 + ((a ^ b) * 2 + b) } return r / (1 << (2 * n)) }
	function draw() {
		const w = c.clientWidth, h = c.clientHeight
		const cw = Math.ceil(w / px), ch = Math.ceil(h / px)
		if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch }
		const lo = css('--lo'), hi = css('--hi'), img = x.createImageData(cw, ch)
		const rgb = (s) => { x.fillStyle = s; const v = x.fillStyle; return [1, 3, 5].map((i) => parseInt(v.slice(i, i + 2), 16)) }
		const A = rgb(lo), B = rgb(hi), R = rd / 100
		for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
			const u = i / cw, v = j / ch
			const d = Math.hypot((u - mx) * cw / ch, v - my)
			const wave = 0.5 + 0.5 * Math.sin(u * 9 + t) * Math.cos(v * 7 - t * 0.7)
			const val = Math.min(1, Math.max(0, 1 - d / R)) * 0.85 + wave * 0.25
			const col = val > bayer(i, j, lv) ? B : A, o = (j * cw + i) * 4
			img.data[o] = col[0]; img.data[o + 1] = col[1]; img.data[o + 2] = col[2]; img.data[o + 3] = 255
		}
		x.putImageData(img, 0, 0)
	}
	function loop() { t += 0.015; draw(); requestAnimationFrame(loop) }
	c.addEventListener('pointermove', (e) => { const r = c.getBoundingClientRect(); mx = (e.clientX - r.left) / r.width; my = (e.clientY - r.top) / r.height })
	$('px').oninput = (e) => { px = +e.target.value; $('pxo').value = px }
	$('lv').oninput = (e) => { lv = +e.target.value; const n = 1 << lv; $('lvo').value = n + '×' + n }
	$('rd').oninput = (e) => { rd = +e.target.value; $('rdo').value = rd }
	if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(); c.addEventListener('pointermove', draw) } else loop()
</script>
</body>
</html>
